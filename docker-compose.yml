services:
  db:
    image: postgres:16
    container_name: site-vendas-oleo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: site_vendas_oleo
    ports:
      - "5434:5432"
    volumes:
      - site-vendas-oleo-db-data:/var/lib/postgresql/data

volumes:
  site-vendas-oleo-db-data:
